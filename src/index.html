<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" id="favicon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <span class="crumb"><span id="crumb-icon"></span><span id="crumb-title"></span></span>
  </header>

  <div class="cover" id="cover" hidden><img id="cover-img" alt=""></div>

  <main class="page" id="page">
    <div class="page-icon" id="page-icon"></div>
    <h1 id="site-title"></h1>
    <p class="tagline" id="tagline" hidden></p>
    <hr>

    <section aria-labelledby="gallery-heading">
      <div class="view-head">
        <h2 id="gallery-heading"></h2>
        <div class="view-tools">
          <div class="tabs" id="filters" role="tablist" aria-label="Filter by tag"></div>
          <span class="count" id="count"></span>
        </div>
      </div>
      <div class="gallery" id="grid"></div>
      <p class="empty" id="empty" hidden>No photos yet. Add some to the <code>photos</code> folder.</p>
    </section>

    <section class="about" id="about" hidden>
      <h2>About</h2>
      <div id="about-text"></div>
      <ul class="links" id="links"></ul>
    </section>
  </main>

  <footer class="footer" id="footer-text"></footer>

  <div class="peek" id="peek" role="dialog" aria-modal="true" aria-labelledby="pk-title" hidden>
    <div class="peek-backdrop" id="peek-backdrop"></div>
    <article class="peek-panel" id="peek-panel">
      <div class="peek-bar">
        <div class="peek-nav">
          <button class="icon-btn" id="pk-prev" aria-label="Previous photo"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" /></svg></button>
          <button class="icon-btn" id="pk-next" aria-label="Next photo"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" /></svg></button>
          <span class="peek-pos" id="pk-pos"></span>
        </div>
        <div class="peek-nav">
          <button class="text-btn" id="pk-share">Copy link</button>
          <button class="icon-btn" id="pk-close" aria-label="Close"><svg viewBox="0 0 16 16"><path d="m3.5 3.5 9 9m0-9-9 9" /></svg></button>
        </div>
      </div>
      <div class="peek-body">
        <h2 class="peek-title" id="pk-title"></h2>
        <div class="props" id="pk-props"></div>
        <div class="peek-images" id="pk-images"></div>
        <div class="peek-text" id="pk-desc"></div>
        <p class="peek-download" id="pk-download"></p>
      </div>
    </article>
  </div>

  <script id="gallery-data" type="application/json">{{GALLERY_JSON}}</script>
  <script src="app.js"></script>
</body>
</html>
