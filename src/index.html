<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#07080c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%2307080c'/><path d='M16 5l2.2 8.8L27 16l-8.8 2.2L16 27l-2.2-8.8L5 16l8.8-2.2z' fill='%23e8e4d8'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <header class="hero">
    <p class="eyebrow" id="photographer"></p>
    <h1 id="site-title"></h1>
    <p class="tagline" id="tagline"></p>
    <nav class="top-nav">
      <a href="#gallery">Gallery</a>
      <a href="#about" id="about-link">About</a>
    </nav>
  </header>

  <main>
    <section id="gallery" aria-label="Gallery">
      <div class="toolbar">
        <div class="filters" id="filters" role="tablist" aria-label="Filter by category"></div>
        <p class="count" id="count"></p>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>No photos yet — add some to the <code>photos</code> folder.</p>
    </section>

    <section id="about" class="about" hidden>
      <h2>About</h2>
      <div id="about-text"></div>
      <ul class="links" id="links"></ul>
    </section>
  </main>

  <footer class="footer">
    <span id="footer-text"></span>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
    <div class="lb-stage" id="lb-stage">
      <img id="lb-img" alt="">
      <div class="lb-spinner" id="lb-spinner"></div>
      <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
      <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo">&#8250;</button>
      <button class="lb-stage-close" id="lb-close2" aria-label="Close">&times;</button>
    </div>
    <aside class="lb-info" id="lb-info">
      <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
      <p class="lb-meta" id="lb-meta"></p>
      <h2 id="lb-title"></h2>
      <div class="lb-desc" id="lb-desc"></div>
      <dl class="lb-details" id="lb-details"></dl>
      <div class="lb-actions">
        <a id="lb-download" class="button" download>Download full size</a>
        <button id="lb-share" class="button ghost">Copy link</button>
      </div>
    </aside>
    <button class="lb-toggle" id="lb-toggle" aria-label="Show details">i</button>
  </div>

  <script id="gallery-data" type="application/json">{{GALLERY_JSON}}</script>
  <script src="app.js"></script>
</body>
</html>
